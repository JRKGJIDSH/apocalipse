<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apocalipse zumbi: Evolução</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #111; 
            color: #fff; 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden; 
            user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            margin: 10px auto;
            background: #222;
            border: 4px solid #444;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            background: #333;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
            z-index: 10;
        }
        .hud-item {
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid #555;
        }
        #phaseBanner {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            text-shadow: 3px 3px 0px #000;
            pointer-events: none;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s ease;
            width: 100%;
        }
        #gameOverScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }
        #gameOverScreen h1 {
            font-size: 50px;
            color: #ff3333;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0px #000;
        }
        #gameOverScreen p {
            font-size: 20px;
            margin-bottom: 30px;
        }
        .btn {
            background: #ff3333;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 20px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 5px 0 #990000;
            font-weight: bold;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #990000;
        }
        #controlsHelp {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 13px;
            pointer-events: none;
            text-align: center;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">
        <div class="hud-item" id="scoreDiv">PONTOS: 0</div>
        <div class="hud-item" id="phaseDiv" style="color: #44ff44;">FASE: INTRO (PASSEIO CALMO)</div>
        <div class="hud-item" id="nitroDiv" style="color: #00ffff;">NITRO: INDISPONÍVEL</div>
    </div>
    <div id="phaseBanner">MUDANÇA DE FASE!</div>
    <div id="gameOverScreen">
        <h1>GAME OVER</h1>
        <p id="finalScore">Pontuação Total: 0</p>
        <button class="btn" onclick="resetGame()">JOGAR NOVAMENTE</button>
    </div>
    <div id="controlsHelp">
        Mover: <b>A / D</b> ou <b>Setas</b> | Atirar: <b>ESPAÇO</b> (Desbloqueia após a queda!)
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Configurações do jogo
let score = 0;
let gameActive = true;
let gameSpeed = 3; 
let globalTime = 0;
let phase = 0; 
let raceStarted = false;

// Configuração das pistas
const roadX = 200;
const roadWidth = 400;
const lanes =; 

// Efeito da água
let waterOffset = 0;

// Configuração do evento do avião
let planeEvent = {
    triggered: false,
    x: -150,
    y: 100,
    speedX: 8,
    speedY: 4,
    size: 60,
    crashed: false
};

// Jogador
const player = {
    lane: 1,
    x: lanes[1],
    y: 500,
    width: 45,
    height: 80,
    targetX: lanes[1],
    speed: 15,
    nitroActive: false,
    nitroTimer: 0,
    cooldown: 0
};

// Listas de entidades
let obstacles = [];
let projectiles = [];
let items = [];
let sceneryElements = [];
let particles = [];

// Teclas
const keys = {};
window.addEventListener("keydown", e => {
    keys[e.code] = true;
    if (e.code === "ArrowLeft" || e.code === "KeyA") {
        if (player.lane > 0) { player.lane--; player.targetX = lanes[player.lane]; }
    }
    if (e.code === "ArrowRight" || e.code === "KeyD") {
        if (player.lane < 2) { player.lane++; player.targetX = lanes[player.lane]; }
    }
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

// Disparo de tiros
function handleShooting() {
    if (!raceStarted) return;
    if (player.cooldown > 0) player.cooldown--;
    
    if (keys["Space"] && player.cooldown === 0) {
        projectiles.push({
            x: player.x,
            y: player.y - 10,
            width: 6,
            height: 15,
            speed: 15
        });
        player.cooldown = player.nitroActive ? 4 : 8;
        createExplosion(player.x, player.y - 10, "#ffcc00", 3);
    }
}

function createExplosion(x, y, color, count, size = 3) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            size: Math.random() * size + 2,
            color: color,
            alpha: 1
        });
    }
}

function showPhaseBanner(text, color) {
    const banner = document.getElementById("phaseBanner");
    banner.innerText = text;
    banner.style.color = color;
    banner.style.opacity = 1;
    setTimeout(() => { banner.style.opacity = 0; }, 2500);
}

// Animação do avião caindo
function updatePlaneAnimation() {
    if (globalTime === 200) { 
        showPhaseBanner("⚠️ ALERTA: ANOMALIA ADENTRANDO A ATMOSFERA! ⚠️", "#ffaa00");
    }

    if (globalTime > 350 && !planeEvent.crashed) { 
        planeEvent.triggered = true;
        planeEvent.x += planeEvent.speedX;
        planeEvent.y += planeEvent.speedY;

        if (globalTime % 2 === 0) {
            createExplosion(planeEvent.x - 20, planeEvent.y, "#333333", 2, 6);
            createExplosion(planeEvent.x - 10, planeEvent.y, "#ff5500", 1, 4);
        }

        if (planeEvent.x >= 380 && !planeEvent.crashed) {
            planeEvent.crashed = true;
            raceStarted = true;
            phase = 1;
            gameSpeed = 6; 
            
            createExplosion(400, 300, "#ff3300", 90, 14);
            createExplosion(400, 300, "#ffcc00", 70, 9);
            createExplosion(400, 300, "#555555", 60, 16);
            
            showPhaseBanner("O APOCALIPSE COMEÇOU! CORRA!", "#ff0000");
            document.getElementById("phaseDiv").innerText = "FASE: PRAIA (CORRIDA!)";
            document.getElementById("phaseDiv").style.color = "#ff3333";
            document.getElementById("nitroDiv").innerText = "NITRO: PRONTO";
            
            obstacles.push({
                x: lanes[1],
                y: 150,
                width: 65,
                height: 55,
                type: "car",
                hp: 4,
                maxHp: 4,
                speed: 1,
                color: "#111"
            });
        }
    }
}

function spawnManager() {
    globalTime++;
    updatePlaneAnimation();

    if (!raceStarted) {
        if (Math.random() < 0.02) {
            let isLeft = Math.random() > 0.5;
            sceneryElements.push({
                x: isLeft ? Math.random() * 140 : 640 + Math.random() * 140,
                y: -50,
                type: "palm_tree",
                size: Math.random() * 20 + 30
            });
        }
        return; 
    }

    if (phase === 1 && globalTime > 1300) {
        phase = 2;
        showPhaseBanner("FIM DO MUNDO: NOITE DOS ZUMBIS", "#ff3333");
        document.getElementById("phaseDiv").innerText = "FASE: NOITE (ZUMBIS)";
        document.getElementById("phaseDiv").style.color = "#ff3333";
    } else if (phase === 2 && globalTime > 2500) {
        phase = 3;
        showPhaseBanner("MUNDO DESÉRTICO: INVASÃO ROBÔ", "#ffaa00");
        document.getElementById("phaseDiv").innerText = "FASE: NORDESTE (ROBÔS)";
        document.getElementById("phaseDiv").style.color = "#ffaa00";
    }

    if (globalTime % 300 === 0) {
        gameSpeed += 0.5;
    }

    if (Math.random() < 0.008) {
        let laneIndex = Math.floor(Math.random() * 3);
        items.push({
            x: lanes[laneIndex],
            y: -50,
            width: 25,
            height: 35,
            type: "nitro"
        });
    }

    if (Math.random() < 0.025 + (gameSpeed * 0.002)) {
        let laneIndex = Math.floor(Math.random() * 3);
        let typeChance = Math.random();
        
        if (phase === 1) {
            obstacles.push({
                x: lanes[laneIndex],
                y: -60,
                width: 45,
                height: 75,
                type: "car",
                hp: 2,
                maxHp: 2,
                speed: gameSpeed * 0.3,
                color: typeChance > 0.5 ? "#555" : "#a33"
            });
        } else if (phase === 2) {
